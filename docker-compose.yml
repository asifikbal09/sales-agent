services:
  sales-agent:
    build: .
    container_name: sales-agent-api
    ports:
      - "8002:8000"
    
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432

    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    
    depends_on:
      db:
        condition: service_healthy

    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  
  db:
    image: pgvector/pgvector:pg17
    container_name: sales-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - sales_agent_db_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_agent"]
      interval: 5s
      timeout: 5s
      retries: 10



volumes:
  sales_agent_db_data: